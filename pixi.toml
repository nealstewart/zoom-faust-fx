[workspace]
name = "zoom-faust-fx"
channels = ["conda-forge"]
platforms = ["win-64"]

[dependencies]
python = ">=3.11,<3.13"
construct = "*"
crcmod = "*"
pyelftools = "*"
pillow = "*"
zig = ">=0.17.1,<0.18"

[pypi-dependencies]
mido = "*"
python-rtmidi = "*"
fastapi = ">=0.115"
uvicorn = { version = ">=0.30", extras = ["standard"] }
python-multipart = ">=0.0.9"
httpx = ">=0.27"

[activation.env]
ZOOM_TI_CGT = "C:\\Users\\neala\\.gemini\\antigravity\\scratch\\stomphacks\\.tools\\ti-cgt-c6000_8.5.0.LTS"

[tasks]
test = "python -m unittest discover -s tests -v"
midi-ports = "python vendor/stomphacks/tools-pedal/midi_ports.py"
selftest = "python vendor/stomphacks/tools-pedal/install_selftest.py"
safe-connect = "python vendor/stomphacks/tools-pedal/safe_connect.py session/"
backup = "python vendor/stomphacks/tools-pedal/backup_pedal.py backup/"
build-rackptch = "python -m zoom_faust_fx.cli build effects/rackptch"
build-svfflt = "python -m zoom_faust_fx.cli build effects/svfflt"
build-anlgdrv = "python -m zoom_faust_fx.cli build effects/anlgdrv"
build-xaspu = "python -m zoom_faust_fx.cli build effects/xaspu"
build-xarvb = "python -m zoom_faust_fx.cli build effects/xarvb"
build-ym2612 = "python -m zoom_faust_fx.cli build effects/ym2612"
web-build = "python web/build_wasm.py"
web = "python web/serve.py"
