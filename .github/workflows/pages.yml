name: Deploy WebAssembly Auditioner to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with stomphacks submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pillow

      - name: Build WebAssembly effects and pixel-art icons
        run: python web/build_wasm.py

      - name: Stage static site artifact
        run: |
          mkdir -p _site
          cp web/index.html web/app.js web/styles.css web/worklet-processor.js _site/
          cp -r web/dist _site/dist
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
