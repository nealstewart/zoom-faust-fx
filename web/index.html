<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d74b0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>FAUST FX — WebAssembly Pedalboard Auditioner</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <!-- Shared SVG definitions for rotary knobs -->
  <svg aria-hidden="true" width="0" height="0" style="position:absolute;pointer-events:none">
    <defs>
      <linearGradient id="knobGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#3c434f" />
        <stop offset="100%" stop-color="#171a20" />
      </linearGradient>
    </defs>
  </svg>
  <div class="app-shell">
    <!-- Top Header & Transport -->
    <header class="topbar">
      <div class="topbar-head">
        <div class="brand">
          <div class="brand-logo">FX</div>
          <div>
            <h1>FAUST FX <span class="badge-wasm">WASM DSP</span></h1>
            <div class="subtitle">WebAssembly Pedalboard Auditioner · 44.1 kHz / 16-sample blocks</div>
          </div>
        </div>
        <div class="topbar-mobile-actions mobile-only">
          <button id="mobileBypassBtn" type="button" class="btn btn-sm btn-bypass" title="Global Bypass">
            <span class="led"></span> ON
          </button>
          <button id="toggleMasterBtn" type="button" class="btn btn-sm btn-ghost" aria-expanded="false" title="Show/hide mixer & oscilloscope">
            Mix ▾
          </button>
        </div>
      </div>

      <!-- Oscilloscope / Spectrum -->
      <div class="scope-box mobile-collapsible" title="Click to switch Oscilloscope / Spectrum">
        <canvas id="scopeCanvas" width="240" height="48"></canvas>
        <span id="scopeModeLabel" class="scope-label">SCOPE</span>
      </div>

      <!-- Master Controls & VU Meters -->
      <div class="master-bar mobile-collapsible">
        <div class="meter-group" title="Input Peak L/R">
          <span class="meter-tag">IN</span>
          <div class="meter-bars">
            <div class="meter-track"><div id="meterInL" class="meter-fill"></div></div>
            <div class="meter-track"><div id="meterInR" class="meter-fill"></div></div>
          </div>
        </div>

        <label class="mini-slider" title="Input Gain">
          <span>IN</span>
          <input id="inGainSlider" type="range" min="0" max="200" value="100" />
          <span id="inGainVal" class="mono">100%</span>
        </label>

        <label class="mini-slider" title="Master Wet/Dry Mix">
          <span>WET</span>
          <input id="masterMixSlider" type="range" min="0" max="100" value="100" />
          <span id="masterMixVal" class="mono">100%</span>
        </label>

        <label class="mini-slider" title="Master Output Level">
          <span>OUT</span>
          <input id="outGainSlider" type="range" min="0" max="150" value="90" />
          <span id="outGainVal" class="mono">90%</span>
        </label>

        <div class="meter-group" title="Output Peak L/R">
          <span class="meter-tag">OUT</span>
          <div class="meter-bars">
            <div class="meter-track"><div id="meterOutL" class="meter-fill"></div></div>
            <div class="meter-track"><div id="meterOutR" class="meter-fill"></div></div>
          </div>
        </div>

        <button id="globalBypassBtn" class="btn btn-bypass" title="Global Bypass (Space)">
          <span class="led"></span> ACTIVE
        </button>
        <button id="panicBtn" class="btn btn-ghost" title="Clear all delay/reverb buffers">PANIC</button>
      </div>
    </header>

    <!-- Audio Source Bar -->
    <section class="source-bar">
      <div class="source-tabs" role="tablist">
        <button class="tab-btn active" data-source="synth">Test Synth</button>
        <button class="tab-btn" data-source="sample">Dry Samples / File</button>
        <button class="tab-btn" data-source="mic">Live Mic / Guitar</button>
      </div>

      <!-- Sample / File Player -->
      <div id="panel-sample" class="source-panel">
        <select id="sampleSelect" class="select-input"></select>
        <button id="playSampleBtn" class="btn btn-primary">▶ Play</button>
        <button id="loopSampleBtn" class="btn btn-toggle active" title="Loop playback">↻ Loop</button>
        <div class="scrub-wrap">
          <input id="scrubSlider" type="range" min="0" max="1000" value="0" />
          <span id="timeDisplay" class="mono time-label">0:00 / 0:00</span>
        </div>
        <label class="btn btn-ghost file-upload-btn" title="Load a local WAV/MP3/OGG/FLAC file">
          + Load Audio
          <input id="fileInput" type="file" accept="audio/*" hidden />
        </label>
      </div>

      <!-- Test Synth (TB-303 Acid Sequencer & Keyboard) -->
      <div id="panel-synth" class="source-panel active">
        <div class="synth-primary">
          <button id="autoRiffBtn" class="btn btn-primary">▶ 303 Loop</button>
          <button id="acidRandBtn" class="btn btn-ghost btn-sm" title="Generate a new random 16-step acid bassline">🎲</button>
          <button id="toggleSynthExtrasBtn" type="button" class="btn btn-ghost btn-sm mobile-only" aria-expanded="false" title="Show/hide synth voice, filter & keyboard">Tone ▾</button>
        </div>
        <div id="synthExtras" class="synth-extras">
          <select id="synthVoiceSelect" class="select-input">
            <option value="acid_saw">TB-303 Acid Saw</option>
            <option value="acid_sqr">TB-303 Acid Square</option>
            <option value="pluck">Pluck</option>
            <option value="pad">Dreamy Pad</option>
          </select>
          <select id="acidPatternSelect" class="select-input" title="Synth sequence pattern (synced to toolbar BPM)">
            <option value="acid1">Acid 1 (Classic)</option>
            <option value="acid2">Acid 2 (Phuture)</option>
            <option value="ebm">EBM Octave</option>
            <option value="minimal">Dark Minimal</option>
            <option value="dreamy_pad">Dreamy Pad (Long)</option>
          </select>
          <label class="mini-slider" title="303 Filter Cutoff">
            <span>CUT</span>
            <input id="acidCutoffSlider" type="range" min="0" max="100" value="38" />
          </label>
          <label class="mini-slider" title="303 Filter Resonance (Squelch)">
            <span>RES</span>
            <input id="acidResSlider" type="range" min="0" max="100" value="72" />
          </label>
          <div id="miniKeyboard" class="mini-keyboard" title="Click keys or use computer keys A-K"></div>
        </div>
      </div>

      <!-- Live Mic / Interface -->
      <div id="panel-mic" class="source-panel">
        <button id="micEnableBtn" class="btn btn-primary">🎙 Enable Live Input</button>
        <select id="micDeviceSelect" class="select-input" disabled>
          <option value="">Default Audio Input</option>
        </select>
        <span id="micStatus" class="status-pill">Idle (use headphones to avoid feedback)</span>
      </div>

      <div class="audio-status">
        <button id="audioCtxState" type="button" class="status-pill status-pill-btn" title="Tap to start or resume audio">Audio: Tap Play or a Key to Start</button>
      </div>
    </section>

    <!-- Main Workspace -->
    <div class="workspace">
      <div id="sidebarBackdrop" class="sidebar-backdrop" aria-hidden="true"></div>

      <!-- Left Sidebar: Effect Catalog -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <div class="sidebar-head-row">
            <h2>ZD2 Effects (<span id="effectCount">0</span>)</h2>
            <button id="closeSidebarBtn" type="button" class="icon-btn mobile-only" aria-label="Close effects catalog">×</button>
          </div>
          <input id="searchInput" type="search" class="search-input" placeholder="Search effects..." />
          <div id="categoryPills" class="category-pills"></div>
        </div>
        <div id="effectList" class="effect-list"></div>
      </aside>

      <!-- Main Stage: Pedalboard Chain -->
      <main class="stage">
        <div class="stage-toolbar">
          <div class="chain-info">
            <button id="openSidebarBtn" type="button" class="btn btn-primary btn-sm mobile-only">+ Effects</button>
            <span class="chain-label">SIGNAL CHAIN</span>
            <span id="chainSummary" class="mono muted">IN → (empty) → OUT</span>
          </div>
          <div class="preset-group">
            <div class="bpm-box" title="Global Tempo for beat-synced effects (e.g. PS1DLY)">
              <span class="muted">BPM</span>
              <input id="bpmInput" type="number" class="bpm-input mono" min="60" max="200" value="120" />
              <button id="tapTempoBtn" class="btn btn-ghost btn-sm" title="Tap repeatedly to set BPM">TAP</button>
            </div>
            <span class="muted">Presets:</span>
            <select id="presetSelect" class="select-input select-sm">
              <option value="">Load preset chain…</option>
              <option value="xa_lofi">32-Bit XA Lo-Fi Space (XA SPU → XA Reverb)</option>
              <option value="xa_dub">32-Bit XA BBD Dub (XA SPU → XA Delay → XA Reverb)</option>
              <option value="xa_dream">32-Bit XA Dream Pad (XA Chorus → XA Delay → XA Reverb)</option>
              <option value="fm_32bit">FM / PCM / SCSP (YM2612 → RF5C Delay → SCSP Rvb)</option>
              <option value="brr_16bit">16-Bit BRR Echo (BRR DSP → FIR Echo)</option>
              <option value="ebm_dirt">Industrial EBM (Desk Drive → Slew Drive → TZ Flanger)</option>
              <option value="glitch_pitch">Glitch Pitch (CD Skip → Rack Pitch → Soph WG)</option>
              <option value="parallel_split">Parallel Split/Merge (WfSplit → Swed Saw → WfSwap → XA Reverb → WfMerge)</option>
            </select>
            <button id="clearChainBtn" class="btn btn-ghost btn-sm">Clear Chain</button>
          </div>
        </div>

        <div id="pedalboard" class="pedalboard">
          <!-- Stompbox cards rendered here -->
        </div>

        <div id="dropOverlay" class="drop-overlay hidden">
          <div class="drop-box">Drop audio file (WAV / MP3 / OGG / FLAC) to audition</div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
